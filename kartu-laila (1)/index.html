<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Happy Birthday, Laila</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
:root{--ink:#3b2a4d;--paper:#fff8ef;--pink:#ff7eb6}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{font-family:'VT323',ui-monospace,monospace;font-size:22px;background:#9fd8f2;overflow:hidden;color:var(--ink)}
.px{font-family:'Press Start 2P',ui-monospace,monospace}
button{font-family:inherit;cursor:pointer}canvas{image-rendering:pixelated;display:block}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0}
.win{width:100%;max-height:88dvh;display:flex;flex-direction:column;background:var(--paper);box-shadow:0 0 0 3px var(--ink),7px 7px 0 3px var(--ink);animation:pop .22s steps(4)}
@keyframes pop{from{transform:scale(.82);opacity:0}}
.bar{display:flex;justify-content:space-between;align-items:center;padding:9px 10px;color:var(--ink);font:10px 'Press Start 2P',monospace;background:repeating-linear-gradient(#ffb3d3 0 3px,#fff8ef 3px 6px);border-bottom:3px solid var(--ink)}
.bar span{background:var(--paper);padding:3px 8px}
.bar button{font:10px 'Press Start 2P',monospace;color:var(--ink);background:var(--paper);border:3px solid var(--ink);padding:5px 8px}
.body{padding:16px;overflow:auto;-webkit-overflow-scrolling:touch;background:radial-gradient(#f6d5e5 1px,transparent 1.5px) 0 0/10px 10px,var(--paper)}
.btn{font:10px 'Press Start 2P',monospace;background:#fff;border:3px solid var(--ink);box-shadow:4px 4px 0 var(--ink);padding:11px 15px;color:var(--ink);transition:transform .12s}
.btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
.btn.pk{background:var(--pink);color:#fff}
.row{display:flex;gap:16px;justify-content:center;margin-top:18px;flex-wrap:wrap}
#start{position:fixed;inset:0;display:grid;place-items:center;z-index:9;padding:16px}
.stk{position:relative;width:min(88vw,390px)}
.stk .g{position:absolute;inset:0;height:100%;animation:none}
.g1{transform:translate(-18px,-18px)}.g2{transform:translate(-9px,-9px)}
.stk .top{position:relative}
.ask{text-align:center;font-size:25px;line-height:1.1}.ask canvas{width:84px;margin:0 auto 8px}
.pg{height:24px;border:3px solid var(--ink);background:#fff;margin-top:14px;padding:3px}
.pg i{display:block;height:100%;width:0;background:repeating-linear-gradient(90deg,var(--pink) 0 10px,#fff 10px 13px)}
#ui{position:fixed;inset:0;z-index:2;visibility:hidden;pointer-events:none}
#ui.on{visibility:visible;pointer-events:auto}
#tag{position:absolute;top:7%;left:50%;transform:translateX(-50%) rotate(-3deg);background:var(--paper);box-shadow:0 0 0 3px var(--ink),8px 8px 0 3px var(--ink);padding:22px 28px;text-align:center;font-size:clamp(15px,5vw,28px);line-height:1.7;color:var(--pink);text-shadow:3px 3px 0 var(--ink);outline:2px dashed var(--pink);outline-offset:-10px;white-space:nowrap}
#tag small{display:block;font-size:.72em;color:var(--ink);text-shadow:none;margin-top:6px}
#ui.on #tag{animation:drop .9s steps(8) both}
@keyframes drop{0%{transform:translate(-50%,-160%) rotate(-3deg)}60%{transform:translate(-50%,8%) rotate(-3deg)}80%{transform:translate(-50%,-4%) rotate(-3deg)}100%{transform:translate(-50%,0) rotate(-3deg)}}
#icons{position:absolute;left:0;right:0;top:40%;display:flex;gap:clamp(8px,3vw,34px);justify-content:center;padding:0 10px}
.ic{width:clamp(66px,17vw,122px);background:none;border:0;font:clamp(7px,2vw,10px) 'Press Start 2P',monospace;color:var(--ink);text-align:center;text-shadow:1px 1px 0 #fff}
.ic .b{aspect-ratio:1;display:grid;place-items:center;background:var(--paper);box-shadow:0 0 0 3px var(--ink),6px 6px 0 3px var(--ink);margin-bottom:14px;animation:bob 2.2s steps(2) infinite}
.ic:nth-child(2) .b{animation-delay:.3s}.ic:nth-child(3) .b{animation-delay:.6s}.ic:nth-child(4) .b{animation-delay:.9s}
@keyframes bob{50%{transform:translateY(-5px)}}
.ic .b canvas{width:74%}.ic:active .b{transform:translate(4px,4px);box-shadow:0 0 0 3px var(--ink),2px 2px 0 3px var(--ink)}
.spin{animation:sp 3s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
#hint{position:absolute;left:0;right:0;bottom:3.5%;text-align:center;font-size:8px;color:#fff;text-shadow:2px 2px 0 var(--ink)}
#ov{position:fixed;inset:0;display:none;place-items:center;background:rgba(59,42,77,.5);padding:12px;z-index:5}
#ov.on{display:grid}#ov .win{width:min(100%,540px)}
.gal{display:grid;grid-template-columns:1fr 1fr;gap:20px 14px;padding:8px 4px}
.ph{background:#fff;padding:8px 8px 12px;box-shadow:0 0 0 2px var(--ink),5px 5px 0 2px var(--ink);position:relative;transform:rotate(var(--r));cursor:zoom-in;transition:transform .2s}
.ph::before{content:'';position:absolute;top:-11px;left:50%;width:46px;height:18px;margin-left:-23px;background:rgba(255,216,107,.9);transform:rotate(-4deg)}
.ph img{width:100%;aspect-ratio:1;object-fit:cover;object-position:center 22%;display:block}
.ph.big{grid-column:1/-1;--r:0deg}.ph.big img{aspect-ratio:auto}
.ph p{margin:8px 2px 0;font-size:23px;line-height:1.05;text-align:center;color:#c2417a}
.lt{padding:6px 4px;background:repeating-linear-gradient(transparent 0 25px,#f0cfe0 25px 26px);border-left:3px solid #ffb3d3;padding-left:14px}
.lt p{margin:0 0 26px;font-size:23px;line-height:26px}.c{color:#c2417a}
.pl{text-align:center}.pl canvas{width:120px;margin:4px auto 14px}
#now{font-size:10px;line-height:1.8;min-height:36px}
.prog{height:14px;border:3px solid var(--ink);background:#fff;margin:6px 0 12px}.prog i{display:block;height:100%;width:0;background:var(--pink)}
.eq{display:flex;gap:4px;justify-content:center;align-items:flex-end;height:26px;margin:8px 0}
.eq i{width:8px;height:100%;background:var(--pink);box-shadow:inset 0 0 0 2px var(--ink);transform-origin:bottom;animation:eq .5s steps(4) infinite alternate;animation-play-state:paused}
.eq.on i{animation-play-state:running}.eq i:nth-child(2){animation-delay:.1s}.eq i:nth-child(3){animation-delay:.25s}.eq i:nth-child(4){animation-delay:.05s}.eq i:nth-child(5){animation-delay:.2s}
@keyframes eq{from{transform:scaleY(.2)}to{transform:scaleY(1)}}
.trk{display:block;width:100%;text-align:left;font-size:22px;background:#fff;border:3px solid var(--ink);padding:6px 10px;margin-top:8px}
.trk.on{background:#ffd3e6}
#sp{position:relative;width:min(76vw,320px);aspect-ratio:1;margin:44px auto 20px}
#sp .pic{position:absolute;inset:23%;border-radius:50%;background:center/cover;box-shadow:0 0 0 4px #fff,0 0 0 8px var(--pink),0 0 0 11px var(--ink)}
.hat{position:absolute;left:50%;top:9%;width:0;height:0;border-left:26px solid transparent;border-right:26px solid transparent;border-bottom:58px solid var(--pink);transform:translateX(-50%) rotate(12deg);filter:drop-shadow(3px 3px 0 var(--ink))}
.hat::after{content:'';position:absolute;left:-8px;top:-8px;width:16px;height:16px;background:#ffd86b;border:3px solid var(--ink);border-radius:50%}
.w{position:absolute;left:50%;top:50%}
.w span{display:block;font:8px 'Press Start 2P',monospace;background:#fff;box-shadow:0 0 0 2px var(--ink),3px 3px 0 2px var(--ink);padding:6px 7px;white-space:nowrap;animation:pop .35s steps(4) both}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style></head><body>
<canvas id="bg"></canvas>

<div id="start"><div class="stk">
<div class="win g g1"></div><div class="win g g2"></div>
<div class="win top"><div class="bar"><span>kejutan.exe</span><span>x</span></div>
<div class="body" id="sb"><div class="ask"><div id="cake"></div>Ada kejutan buat Laila.<br>Yakin mau dibuka?
<div class="row"><button class="btn pk" id="yes">Yes</button><button class="btn" id="no">No</button></div></div></div></div>
</div></div>

<div id="ui">
<div id="tag" class="px">happy<br>birthday,<small>Laila</small></div>
<div id="icons">
<button class="ic" data-w="music"><div class="b"></div>musik</button>
<button class="ic" data-w="photo"><div class="b"></div>foto</button>
<button class="ic" data-w="mail"><div class="b"></div>surat</button>
<button class="ic" data-w="gift"><div class="b"></div>kejutan</button>
</div>
<div id="hint" class="px">tap ikon-ikonnya</div>
</div>

<div id="ov"><div class="win"><div class="bar"><span id="ot"></span><button id="cl">x</button></div><div class="body" id="ob"></div></div></div>

<script>
const $=s=>document.querySelector(s);
/* ====== ISI KARTU (edit di sini) ====== */
const TRACKS=[
 {t:"Am I Bothering You - Reality Club",f:"assets/am-i-bothering-you.mp3"},
 {t:"Love Epiphany - Reality Club",f:"assets/love-epiphany.mp3"},
 {t:"pink skies - LANY",f:"assets/pink-skies.mp3"}];
const PHOTOS=[
 {f:"assets/foto6.jpg"},{f:"assets/foto4.jpg"},{f:"assets/foto5.jpg"},
 {f:"assets/foto2.jpg"},{f:"assets/foto3.jpg"},
 {f:"assets/foto1.jpg",c:"oiya ini foto yang bikin kalau kangen orang nya",wide:1}];
const GIFT_PHOTO="assets/foto5.jpg";
const WORDS=["bawel","suka ngambek","alay","lebay","ngeselin","sok iya (kepedean)"];
const LETTER=`Halo, Laila.
Selamat ulang tahun! Aku tau kamu pasti udah nungguin ucapan ini sambil bilang "kok bian belum ngucapin sih?" minimal 10 kali nyampe sekarang. Tenang, ini yang paling niat.
Jujur ya, ngucapin selamat ke orang yang bawel, gampang ngambek, alay, lebay, ngeselin, plus sok iya itu butuh keberanian tapi nama tengah gw keberanian jadi silakan tepuk tangan (boleh lebay, itu keahlianmu).
Umurnya si nambah tapi sifat-sifatnya tetap stabil, nggak ada yang berkurang. Sempat berharap ada satu yang hilang, ternyata paket lengkap padahal udah kepala 2 (woi tua)
Nah, sekarang serius dulu sebentar (jangan ngambek, ini bagian manisnya).
Anehnya, justru karena semua yang ngeselin itu, hari-hariku nggak pernah sepi (anjay). Bawelmu bikin aku inget makan (bagian manis ini pakai ai si jadi aneh), ngambekmu bikin aku belajar sabar (jelas ini mah w claude), alay dan lebaymu bikin hal biasa jadi seru. Kepedeanmu sih masih ngeselin, tapi ya, lucu juga.
Aku bersyukur kamu ada. Semoga tahun ini isinya hal-hal yang bikin kamu senyum, dan semoga gweh masih boleh jadi orang yang kamu repotin lebih lama lagi.
Selamat ulang tahun, Laila. Maaf yah kalau suka jahat belakangan ini anggap aja kalau lagi sibuk berarti jahat kalau lagi gak sibuk lagi baik salahkan dunia ini yang terlalu sibuk jangan salahin gweh
Dari yang ngucapin belakangan tapi paling dinanti anjay,
Bian`;
/* ====================================== */

/* sprite pixel 12x12 */
const P={k:'#3b2a4d',g:'#d9d2e9',w:'#fff8ef',r:'#e8326b',y:'#ffd86b',o:'#ff9a3c',b:'#f4a6c6',p:'#ff7eb6',q:'#5aa9e6'};
const S={
vinyl:["....kkkk....","..kkkkkkkk..",".kkkggkkkkk.",".kkgkkkkkkk.","kkkkkrrkkkkk","kkkkrrrrkkkk","kkkkrrrrkkkk","kkkkkrrkkkkk",".kkkkkkkgkk.",".kkkkkkgkkk.","..kkkkkkkk..","....kkkk...."],
cam:["...kkkk.....",".kkkkkkkkkk.","kggggggggggk","kgggkkkkgggk","kggkwwwwkggk","kggkwkkwkggk","kggkwkkwkggk","kggkwwwwkggk","kgggkkkkgggk","kggggggggggk",".kkkkkkkkkk.","............"],
mail:["............","kkkkkkkkkkkk","kwwwwwwwwwwk","kkwwwwwwwwkk","kwkwwwwwwkwk","kwwkwwwwkwwk","kwwwkkkkwwwk","kwwwwppwwwwk","kwwwwwwwwwwk","kwwwwwwwwwwk","kkkkkkkkkkkk","............"],
qb:["kkkkkkkkkkkk","kqqqqqqqqqqk","kqwqqqqqqwqk","kqqqwwwwqqqk","kqqwwqqwwqqk","kqqqqqwwqqqk","kqqqqwwqqqqk","kqqqqwqqqqqk","kqqqqqqqqqqk","kqqqqwqqqqqk","kqwqqqqqqwqk","kkkkkkkkkkkk"],
cake:[".....yy.....",".....oo.....","..wwwwwwww..","..wpwpwpwp..",".wwwwwwwwww.",".bbbbbbbbbb.",".bybybybybb.",".bbbbbbbbbb.",".bbbbbbbbbb.","kkkkkkkkkkkk","............","............"]};
function spr(rows){const c=document.createElement('canvas');c.width=12;c.height=12;const x=c.getContext('2d');rows.forEach((r,j)=>[...r].forEach((h,i)=>{if(P[h]){x.fillStyle=P[h];x.fillRect(i,j,1,1)}}));return c}
$('#cake').append(spr(S.cake));
const MAP={music:'vinyl',photo:'cam',mail:'mail',gift:'qb'};
document.querySelectorAll('.ic').forEach(b=>{const c=spr(S[MAP[b.dataset.w]]);if(b.dataset.w=='music')c.classList.add('v');b.querySelector('.b').append(c)});

/* latar pixel */
const cv=$('#bg'),cx=cv.getContext('2d');let W,H,PX,A,B,clouds,sp,conf=[],t=0,sd=7;
const R=()=>(sd=sd*16807%2147483647)/2147483647;
const rc=(g,c,x,y,w,h)=>{g.fillStyle=c;g.fillRect(x|0,y|0,w|0,h|0)};
const mk=()=>{const c=document.createElement('canvas');c.width=W;c.height=H;return c};
function pine(g,x,by,h,c1,c2){for(let r=0;r<h;r++){const hw=Math.max(1,(r*.42|0)-((r%6)<2&&r>3?1:0)+1);rc(g,c1,x-hw,by-h+r,hw+1,1);rc(g,c2,x+1,by-h+r,hw,1)}rc(g,'#5b3a3a',x,by,2,2)}
function build(){
 PX=innerWidth<700?3:4;W=Math.ceil(innerWidth/PX);H=Math.ceil(innerHeight/PX);cv.width=W;cv.height=H;sd=7;
 A=mk();B=mk();const a=A.getContext('2d'),b=B.getContext('2d'),hz=H*.8|0,T=[[143,211,244],[255,208,229]];
 for(let y=0;y<hz;y++){const k=Math.round(y/hz*8)/8;rc(a,`rgb(${T[0].map((v,i)=>v+(T[1][i]-v)*k|0)})`,0,y,W,1)}
 const sx=W*.72|0,sy=H*.52|0;
 for(let dy=-14;dy<=14;dy++)for(let dx=-14;dx<=14;dx++){const d=dx*dx+dy*dy;if(d<=100)rc(a,'#fff3b8',sx+dx,sy+dy,1,1);else if(d<=196&&((dx+dy)&1))rc(a,'rgba(255,243,184,.6)',sx+dx,sy+dy,1,1)}
 [[.62,'#c3d2ee',.05,.11],[.7,'#a9c7da',.07,.17]].forEach(([k,c,f1,f2])=>{for(let x=0;x<W;x++){const y=H*k+Math.sin(x*f1)*5+Math.sin(x*f2+2)*3;rc(a,c,x,y,1,H-y)}});
 [[.80,12,'#4c9a82','#3f8670'],[.85,17,'#37805f','#2c6b50'],[.9,24,'#2a6a4c','#1f5540']].forEach(([k,h,c1,c2],L)=>{for(let x=-4;x<W+6;x+=10+L*3)pine(b,x+(R()*8|0),H*k|0,h+(R()*6|0),c1,c2)});
 const gy=H*.9|0;rc(b,'#7fc26b',0,gy,W,H);rc(b,'#9be07f',0,gy,W,1);
 for(let i=0;i<W*H/60;i++)rc(b,'#69ab5a',R()*W,gy+1+R()*(H-gy),1,1);
 for(let i=0;i<W/6;i++){const x=R()*W,y=gy+2+R()*(H-gy-3);rc(b,'#4f9a4a',x,y+1,1,2);rc(b,['#ff7eb6','#ffd86b','#fff'][i%3],x,y,1,1)}
 clouds=[...Array(5)].map(()=>({x:R()*W,y:H*(.1+R()*.28),w:18+(R()*16|0),s:.12+R()*.15}));
 sp=[...Array(14)].map(()=>[R()*W|0,R()*H*.4|0]);
}
function draw(){t++;cx.drawImage(A,0,0);
 clouds.forEach(c=>{c.x+=c.s;if(c.x>W+20)c.x=-40;const x=c.x|0,y=c.y|0;rc(cx,'#fff',x+6,y-3,c.w*.5,3);rc(cx,'#fff',x,y,c.w,4);rc(cx,'#e6dcf3',x,y+4,c.w,1)});
 cx.drawImage(B,0,0);
 sp.forEach(([x,y],i)=>{const p=(t+i*3)%16;if(p<8){rc(cx,'#fff',x,y,1,1);if(p<4){rc(cx,'#fff',x-1,y,3,1);rc(cx,'#fff',x,y-1,1,3)}}});
 conf=conf.filter(p=>{p.vy+=.18;p.x+=p.vx;p.y+=p.vy;rc(cx,p.c,p.x,p.y,2,2);return p.y<H})}
function burst(){for(let i=0;i<110;i++)conf.push({x:W/2+(Math.random()-.5)*24,y:H*.3,vx:(Math.random()-.5)*5,vy:-Math.random()*5-1,c:['#ff7eb6','#ffd86b','#5aa9e6','#fff','#9be07f'][i%5]})}
build();draw();setInterval(draw,70);
let rz;addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(build,200)});

/* musik: hanya mulai saat ikon musik ditekan */
const a=new Audio();let n=0,started=0;
const load=i=>{n=(i+TRACKS.length)%TRACKS.length;a.src=TRACKS[n].f};
const play=()=>a.play().catch(()=>{});
const go=d=>{load(n+d);play();upd()};
a.onended=()=>go(1);
a.onplay=a.onpause=()=>{document.querySelectorAll('.v').forEach(v=>v.classList.toggle('spin',!a.paused));document.querySelectorAll('.eq').forEach(e=>e.classList.toggle('on',!a.paused))};
a.ontimeupdate=()=>{const p=$('#pr');if(p&&a.duration)p.style.width=a.currentTime/a.duration*100+'%'};
function upd(){const x=$('#now');if(x)x.textContent=TRACKS[n].t;document.querySelectorAll('.trk').forEach((b,i)=>b.classList.toggle('on',i==n))}

/* pembuka */
const no=$('#no'),rn=()=>Math.round((Math.random()-.5)*90);
const dodge=e=>{e.preventDefault();no.style.transform=`translate(${rn()}px,${rn()/2}px)`};
no.addEventListener('pointerenter',dodge);no.addEventListener('click',dodge);
$('#yes').onclick=()=>{
 $('#sb').innerHTML='<div class="px" style="font-size:10px;line-height:1.8;text-align:center">Loading kejutan...</div><div class="pg"><i id="pb"></i></div>';
 let p=0;const iv=setInterval(()=>{p+=4;$('#pb').style.width=p+'%';
  if(p>=100){clearInterval(iv);$('#start').remove();$('#ui').classList.add('on');burst()}},90)};

/* jendela */
const WN={
music:()=>["playlist.mp3",`<div class="pl"><div id="pv"></div><div id="now" class="px"></div><div class="eq"><i></i><i></i><i></i><i></i><i></i></div><div class="prog"><i id="pr"></i></div>
<div class="row" style="margin-top:6px"><button class="btn" onclick="go(-1)">&lt;&lt;</button><button class="btn pk" onclick="a.paused?play():a.pause()">play/pause</button><button class="btn" onclick="go(1)">&gt;&gt;</button></div>
<div style="margin-top:14px">${TRACKS.map((x,i)=>`<button class="trk" onclick="load(${i});play();upd()">${x.t}</button>`).join('')}</div></div>`],
photo:()=>["kenangan",`<div class="gal">${PHOTOS.map((p,i)=>`<div class="ph ${p.wide?'big':''}" style="--r:${[-2.5,2,-1.5,3,-3,0][i]}deg"><img src="${p.f}" alt="">${p.c?`<p>${p.c}</p>`:''}</div>`).join('')}</div>`],
mail:()=>["surat.txt",`<div class="lt">${LETTER.split('\n').map(l=>`<p>${l.replace(/\(([^)]*)\)/g,'<i class="c">($1)</i>')}</p>`).join('')}</div>`],
gift:()=>["kejutan.exe",`<div id="sp"><div class="pic" style="background-image:url(${GIFT_PHOTO})"></div><div class="hat"></div>${WORDS.map((w,i)=>`<div class="w"><span style="animation-delay:${i*.12+.2}s">${w}</span></div>`).join('')}</div><p class="px" style="font-size:10px;line-height:1.9;text-align:center">selamat ulang tahun, Laila!</p>`]};
function open_(k){const [ti,h]=WN[k]();$('#ot').textContent=ti;$('#ob').innerHTML=h;$('#ov').classList.add('on');
 if(k=='music'){const c=spr(S.vinyl);c.classList.add('v');if(!a.paused)c.classList.add('spin');$('#pv').append(c);
  if(!started){started=1;load(0);play()}upd();document.querySelectorAll('.eq').forEach(e=>e.classList.toggle('on',!a.paused))}
 if(k=='gift'){burst();const box=$('#sp'),rad=box.clientWidth*.46;box.querySelectorAll('.w').forEach((e,i)=>{const d=i*60-10;e.style.transform=`translate(-50%,-50%) rotate(${d}deg) translateY(${-rad}px) rotate(${-d}deg)`})}
 if(k=='photo')document.querySelectorAll('.ph').forEach(p=>p.onclick=()=>p.classList.toggle('big'))}
document.querySelectorAll('.ic').forEach(b=>b.onclick=()=>open_(b.dataset.w));
$('#cl').onclick=()=>$('#ov').classList.remove('on');
$('#ov').onclick=e=>{if(e.target.id=='ov')$('#ov').classList.remove('on')};
</script></body></html>
